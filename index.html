<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Global Holidayz premium attraction database browser.">
  <title>Global Holidayz | Premium Attractions</title>
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
</head>
<body>
  <header class="hero">
    <div class="shell">
      <p class="eyebrow">Global Holidayz · Destination Intelligence</p>
      <h1>Premium attraction library</h1>
      <p class="intro">Explore curated experiences across Europe, Asia, Africa, the Gulf and the Indian Ocean.</p>
    </div>
  </header>

  <main class="shell">
    <section class="controls" aria-label="Destination controls">
      <label>Region<select id="region"><option value="">Select a region</option></select></label>
      <label>Destination<select id="destination" disabled><option value="">Select a destination</option></select></label>
      <label>Search<input id="search" type="search" placeholder="Search attractions or locations" disabled></label>
    </section>

    <nav id="categories" class="categories" aria-label="Filter by category"></nav>
    <div class="toolbar">
      <p id="status" aria-live="polite">Choose a region and destination to begin.</p>
      <button id="reset" type="button">Reset all</button>
    </div>
    <section id="cards" class="grid" aria-label="Attraction results">
      <div class="empty"><span>GH</span><h2>Your curated collection awaits</h2><p>Select a destination to display its premium attractions.</p></div>
    </section>
  </main>
</body>
</html>
